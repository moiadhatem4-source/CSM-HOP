<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05080d">

    <title>CSM HUB | Beyond the Code</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="launch-screen">

        <div class="matrix-background" id="matrix"></div>
        <div class="background-grid"></div>

        <main class="launch-content">

            <div class="system-status">
                <span class="status-dot"></span>
                SYSTEM INITIALIZING
            </div>

            <!-- COLLEGE LOGO -->
            <div class="logo-container">

                <img
                    src="./College-logo.png"
                    alt="College Logo"
                    id="college-logo"
                    onerror="this.style.display='none'; document.getElementById('logo-error').style.display='block';"
                >

                <div id="logo-error" style="display:none; color:#51ffad; font-size:12px;">
                    CSM
                </div>

            </div>

            <h1>CSM <span>HUB</span></h1>

            <p class="tagline">
                BEYOND THE CODE. BEYOND LIMITS.
            </p>

            <div class="terminal-box">
                <p id="terminal-text">
                    Initializing CSM HUB system...
                </p>
                <span class="cursor">_</span>
            </div>

            <section class="countdown-section">

                <p class="countdown-label">
                    THE GATE OPENS IN
                </p>

                <div class="countdown">

                    <div class="time-unit">
                        <span id="days">07</span>
                        <small>DAYS</small>
                    </div>

                    <div class="separator">:</div>

                    <div class="time-unit">
                        <span id="hours">12</span>
                        <small>HOURS</small>
                    </div>

                    <div class="separator">:</div>

                    <div class="time-unit">
                        <span id="minutes">45</span>
                        <small>MINUTES</small>
                    </div>

                    <div class="separator">:</div>

                    <div class="time-unit">
                        <span id="seconds">30</span>
                        <small>SECONDS</small>
                    </div>

                </div>
            </section>

            <p class="footer-text">
                A NEW DIGITAL SPACE FOR CSM STUDENTS
            </p>

        </main>
    </div>

    <script src="script.js"></script>

</body>
</html>
